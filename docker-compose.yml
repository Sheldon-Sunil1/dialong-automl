version: "3.9"

# ---------------------------------------------------------------------------
# Shared configuration
# ---------------------------------------------------------------------------
x-common-env: &common-env
  DIALONG_ENV: ${DIALONG_ENV:-development}
  DIALONG_LOG_LEVEL: ${DIALONG_LOG_LEVEL:-INFO}
  DIALONG_SEED: ${DIALONG_SEED:-42}

x-common-volumes: &common-volumes
  - ./data:/app/data
  - ./artifacts:/app/artifacts
  - ./outputs:/app/outputs
  - ./logs:/app/logs
  - ./configs:/app/configs

services:
  # ---------------------------------------------------------------------------
  # dialong — main application container
  # Phase 1: runs import check only.
  # Phase 5+: replace command with the API server.
  # ---------------------------------------------------------------------------
  dialong:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: dialong-automl:dev
    container_name: dialong-automl
    environment:
      <<: *common-env
    volumes: *common-volumes
    # Override at runtime: docker-compose run dialong pytest -q
    command: >
      python -c "import dialong_automl;
                 print('DiaLong-AutoML', dialong_automl.__version__, 'ready.')"
    restart: "no"

