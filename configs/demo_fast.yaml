# =============================================================================
# DiaLong-AutoML — demo_fast configuration
# Phase 5+6: models, AutoML, training pipeline
# =============================================================================

project_name: "DiaLong-AutoML"
version: "0.1.0"
description: "Explainable Longitudinal AutoML for Diabetes Progression Prediction"

paths:
  data_dir: "data"
  artifacts_dir: "artifacts"
  outputs_dir: "outputs"
  logs_dir: "logs"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  log_to_file: false
  log_filename: "dialong_automl.log"
  max_bytes: 10485760
  backup_count: 3

reproducibility:
  seed: 42
  deterministic_torch: false   # disabled for speed; set true for strict reproducibility
  benchmark_cudnn: false

# ---------------------------------------------------------------------------
# Synthetic data [Phase 2]
# ---------------------------------------------------------------------------
data:
  patients: 500
  min_visits: 4
  max_visits: 6
  min_future_visits: 2
  max_future_visits: 4
  min_days_between_visits: 90
  max_days_between_visits: 240
  missingness_rate: 0.05
  progression_prevalence: 0.30
  seed: 42
  output_dir: "data/synthetic"

# ---------------------------------------------------------------------------
# Cohort [Phase 3]
# ---------------------------------------------------------------------------
cohort:
  mode: "future_outcome"
  min_observation_visits: 3
  max_observation_visits: 4
  prediction_horizon_days: 365
  diabetes_onset_hba1c_threshold: 6.5
  exclude_known_diabetes_at_baseline: true
  require_followup_after_cutoff: true

# ---------------------------------------------------------------------------
# Split [Phase 3]
# ---------------------------------------------------------------------------
split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  random_seed: 42
  stratify: true
  chronological: false

# ---------------------------------------------------------------------------
# Training [Phase 5]
# ---------------------------------------------------------------------------
training:
  seed: 42
  threshold: 0.5
  threshold_strategy: "fixed"   # never tune on the test set
  max_iter_sklearn: 2000

# ---------------------------------------------------------------------------
# GRU [Phase 5]
# ---------------------------------------------------------------------------
gru:
  epochs: 20          # small for fast demo
  patience: 4
  batch_size: 32
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  learning_rate: 0.001
  weight_decay: 0.00001

# ---------------------------------------------------------------------------
# Model search space [Phase 5]
# ---------------------------------------------------------------------------
model:
  enabled_models:
    - logistic_regression
    - random_forest
    - xgboost
    - lightgbm
    - gru
  hyperparameter_overrides: {}

# ---------------------------------------------------------------------------
# Optuna [Phase 5]
# ---------------------------------------------------------------------------
optuna:
  n_trials: 5                                       # small demo
  timeout_seconds: null
  direction: "maximize"
  metric: "roc_auc"
  pruner: "MedianPruner"
  sampler: "TPESampler"
  seed: 42
  n_jobs: 1
  storage: "sqlite:///artifacts/optuna_study.db"    # persisted study
  study_name: "dialong_automl_study"

# ---------------------------------------------------------------------------
# API [Phase 6+ placeholder]
# ---------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1
  title: "DiaLong-AutoML API"
  version: "0.1.0"
  docs_url: "/docs"
  redoc_url: "/redoc"
